[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-paddleocr"
dynamic = ["version"]
description = "PaddleOCR provider for paperless-ngx"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Florian Bernd", email = "git@flobernd.de"},
]
keywords = ["paperless", "paperless-ngx", "paddleocr", "ocr", "ocrmypdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    # NB: no "License ::" classifiers - PEP 639 / setuptools>=77 require the
    # SPDX `license` expression above to be the single source of truth and
    # reject the two from coexisting.
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]
# The plugin does not depend on PaddlePaddle or PaddleOCR. The paperless-ngx
# 3.1 and later images run Python 3.14, which PaddlePaddle does not support,
# so the plugin runs both in a worker process under a second interpreter, and
# the paddle-requirements*.txt files list the packages of that interpreter's
# venv. numpy is listed because the deskew pass imports it in the paperless
# interpreter, where neither ocrmypdf nor lxml requires it.
dependencies = [
    "lxml>=4.9",
    "numpy>=1.26",
    "ocrmypdf>=17.4",
]

[project.urls]
Homepage = "https://github.com/flobernd/paperless-paddleocr"
Issues = "https://github.com/flobernd/paperless-paddleocr/issues"

[project.entry-points."paperless_ngx.parsers"]
paddleocr = "paperless_paddleocr.parser:PaperlessPaddleParser"

[tool.setuptools.dynamic]
version = {attr = "paperless_paddleocr.__version__"}

[tool.setuptools.packages.find]
include = ["paperless_paddleocr*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true
