name: Smoke (paperless-ngx)

# Runs inside the real paperless-ngx image so we catch API drift in
# the paperless parser-plugin surface that the lightweight unit suite
# (which never imports Django/paperless) cannot. The job installs the
# worker venv with PaddlePaddle and PaddleOCR, and the smoke test sends
# one page through the paddle worker, which downloads the PP-OCR models
# from Hugging Face on first use.

on:
  push:
    branches: [master]
  pull_request:
  # One leg of the matrix runs against :latest, so a weekly run catches a
  # paperless-ngx release that breaks the plugin while this repository sees
  # no push. GitHub stops a schedule after 60 days without repository
  # activity, and the workflow then has to be enabled again by hand.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paperless-tag: ["3.0", "latest"]
    container:
      image: ghcr.io/paperless-ngx/paperless-ngx:${{ matrix.paperless-tag }}
      # The s6 entrypoint of the image would boot the whole app, and the job
      # needs only a shell for the smoke script.
      options: --entrypoint /bin/bash
    # Settings so the migration and the smoke test run without live
    # services. The parser reads the SQLite database that the migration step
    # creates, and the in-process cache keeps Redis out. PYTHONPATH is set
    # only on the two steps that import paperless, so the install steps do
    # not run with the paperless source tree on their path.
    env:
      DJANGO_SETTINGS_MODULE: paperless.settings
      # django-treenode's post_migrate handler reads the Django cache,
      # which is Redis by default, and the job runs no Redis.
      PAPERLESS_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
      PAPERLESS_DATA_DIR: /tmp/paperless-data
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_REDIS: redis://localhost:6379
      PAPERLESS_SECRET_KEY: smoke-test-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate paperless Python
        id: py
        run: |
          if [ -x /usr/src/paperless/.venv/bin/python ]; then
            echo "bin=/usr/src/paperless/.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=$(command -v python3)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package (no deps - paperless image already has ocrmypdf)
        run: |
          "${{ steps.py.outputs.bin }}" -m pip install --no-deps --break-system-packages .

      # These are the steps of setup.sh. Keep the two in step. The venv lies
      # at the path the plugin looks for, so PAPERLESS_PADDLEOCR_PYTHON stays
      # unset. The image ships uv, which setup.sh installs when it is missing.
      # setup.sh also resets HOME and hands the model cache to the paperless
      # user, who runs the worker in a deployment. This job runs each step as
      # root, the smoke test and its worker too, so neither applies here.
      - name: Install the worker venv
        env:
          UV_PYTHON_INSTALL_DIR: /opt/paperless-paddleocr/python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libgomp1
          uv python install 3.13
          uv venv --python 3.13 /opt/paperless-paddleocr/venv
          uv pip install --no-cache --python /opt/paperless-paddleocr/venv/bin/python \
            -r paddle-requirements.txt
          chmod -R a+rX /opt/paperless-paddleocr

      # The smoke test constructs the parser, and OcrConfig() reads the
      # application configuration from the database.
      - name: Migrate the SQLite database
        env:
          PYTHONPATH: /usr/src/paperless/src
        run: |
          mkdir -p "$PAPERLESS_DATA_DIR"
          "${{ steps.py.outputs.bin }}" /usr/src/paperless/src/manage.py migrate --noinput

      - name: Run smoke test
        env:
          PAPERLESS_OCR_LANGUAGE: eng
          PYTHONPATH: /usr/src/paperless/src
        run: |
          "${{ steps.py.outputs.bin }}" tests/smoke_paperless.py
